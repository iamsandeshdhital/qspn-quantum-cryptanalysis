version: '3.8'

services:
  qspn:
    build: .
    volumes:
      - ./results:/app/results
      - ./data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
    command: ["-m", "qspn.cli", "--quick"]

  qspn-api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./results:/app/results
    command: ["-m", "uvicorn", "qspn.api:app", "--host", "0.0.0.0", "--port", "8000"]

  qspn-jupyter:
    build: .
    ports:
      - "8888:8888"
    volumes:
      - ./notebooks:/app/notebooks
      - ./results:/app/results
    command: ["jupyter", "notebook", "--ip=0.0.0.0", "--port=8888", "--no-browser", "--allow-root"]
